[package]
name = "madcommit"
version = "0.2.0"
edition = "2021"

[dependencies]
config = "0.15.9"
directories = "6.0.0"
genai = "0.6.0"
git2 = "0.20.0"
log = "0.4.26"
tempfile = "3.18.0"
tokio = { version = "1.44.0", features = ["full"] }
clap = { version = "4.0", features = ["derive"] }
toml = "0.8"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1"
env_logger = "0.11.8"
keyring = { version = "3", features = [
  "apple-native",
  "windows-native",
  "sync-secret-service",
  "crypto-rust",
] }
rpassword = "7"
reqwest = { version = "0.13", default-features = false, features = [
  "json",
  "rustls",
] }
url = "2"

[dev-dependencies]
wiremock = "0.6"
